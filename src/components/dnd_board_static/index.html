<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:transparent;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden}
.board{display:flex;gap:8px;width:100%;min-height:80px}
.day-col{
  flex:1;min-width:0;
  background:rgba(14,17,23,0.97);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:12px;overflow:hidden;
  display:flex;flex-direction:column;
  transition:border-color .15s,background .15s,box-shadow .15s
}
.day-col.today{border-color:rgba(201,255,0,0.3)}
.day-col.over{
  border-color:rgba(201,255,0,0.6)!important;
  background:rgba(15,28,15,0.98)!important;
  box-shadow:0 0 0 1px rgba(201,255,0,0.2),0 4px 20px rgba(201,255,0,0.08)!important
}
.day-header{padding:8px 10px 6px;border-bottom:1px solid rgba(255,255,255,0.05);flex-shrink:0;cursor:pointer;transition:background .15s}
.day-header:hover{background:rgba(201,255,0,0.06)}
.day-name{font-size:9px;color:#6b7280;font-weight:800;text-transform:uppercase;letter-spacing:.08em;line-height:1}
.day-date{font-size:11px;color:#c8d1d9;font-weight:700;margin-top:2px;line-height:1}
.today-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#C9FF00;margin-left:4px;vertical-align:middle}
.day-body{padding:6px;flex:1;min-height:32px}
.empty-day{text-align:center;padding:10px 4px;color:#374151;font-size:9px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.ses{
  border:1.5px solid rgba(255,255,255,0.08);
  border-radius:10px;padding:7px 8px 6px;
  margin-bottom:5px;cursor:grab;
  background:rgba(22,27,34,0.95);user-select:none;position:relative;
  transition:opacity .12s,border-color .15s,background .15s,transform .1s
}
.ses:hover{transform:translateY(-1px);filter:brightness(1.08)}
.ses.dragging{opacity:.2;cursor:grabbing;transform:scale(.97)}
/* Píldora del tipo (ocupa la parte superior del card) */
.pill-type{
  display:inline-block;font-size:10px;font-weight:800;
  padding:3px 8px;border-radius:14px;
  letter-spacing:.01em;line-height:1.15;
  border:1px solid currentColor;max-width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.carga-plan{font-size:9.5px;color:#c8d1d9;font-weight:700;margin-top:5px;line-height:1.25}
.ses-int{
  display:inline-block;font-size:8px;font-weight:700;
  padding:1px 6px;border-radius:10px;color:inherit;
  border:1px solid currentColor;opacity:.85;margin-top:4px
}
.carga-real{font-size:9px;color:#86efac;font-weight:700;margin-top:3px;line-height:1.25}
.calidad-pill{
  position:absolute;top:6px;right:6px;
  font-size:7.5px;font-weight:800;
  padding:2px 6px;border-radius:10px;letter-spacing:.04em;text-transform:uppercase
}
.cal-bueno{background:#22c55e;color:#0E1117}
.cal-normal{background:#7CD0FF;color:#0E1117}
.cal-malo{background:#ef4444;color:#fff}
.adapt-pill{display:inline-block;font-size:7px;font-weight:800;color:#0E1117;background:#7CD0FF;padding:1px 5px;border-radius:8px;margin-left:4px;vertical-align:middle;letter-spacing:.04em}
#dbg{font-size:9px;color:#6b7280;padding:2px 6px;min-height:14px}
</style>
</head>
<body>
<div class="board" id="board"></div>
<div id="dbg"></div>
<script>
var src = null;
var _valueSent = false;

function dbg(msg) { document.getElementById('dbg').textContent = msg; }

function sendReady() {
    window.parent.postMessage({ isStreamlitMessage: true, type: 'streamlit:componentReady', apiVersion: 1 }, '*');
}

function sendValue(value) {
    window.parent.postMessage({
        isStreamlitMessage: true,
        type: 'streamlit:setComponentValue',
        value: value,
        dataType: 'json'
    }, '*');
}

function sendHeight() {
    var h = Math.max(80, document.body.scrollHeight + 16);
    window.parent.postMessage({ isStreamlitMessage: true, type: 'streamlit:setFrameHeight', height: h }, '*');
}

function renderBoard(B) {
    src = null;
    _valueSent = false;
    var el = document.getElementById('board');
    el.innerHTML = '';

    B.forEach(function(day, di) {
        var col = document.createElement('div');
        col.className = 'day-col' + (day.today ? ' today' : '');

        var hdr = document.createElement('div');
        hdr.className = 'day-header';
        var nm = document.createElement('div');
        nm.className = 'day-name';
        nm.textContent = day.header;
        if (day.today) {
            var dot = document.createElement('span');
            dot.className = 'today-dot';
            nm.appendChild(dot);
        }
        var dt = document.createElement('div');
        dt.className = 'day-date';
        dt.textContent = day.date;
        hdr.appendChild(nm);
        hdr.appendChild(dt);
        hdr.addEventListener('click', (function(targetDi){return function(e){
            e.stopPropagation();
            if (_valueSent) return;
            _valueSent = true;
            sendValue({action:'open_day', day: targetDi});
        };})(di));
        col.appendChild(hdr);

        col.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            col.classList.add('over');
        });
        col.addEventListener('dragleave', function(e) {
            if (!col.contains(e.relatedTarget)) col.classList.remove('over');
        });
        col.addEventListener('drop', (function(colEl, targetDi) { return function(e) {
            e.preventDefault();
            colEl.classList.remove('over');
            if (!src || src.di === targetDi || _valueSent) return;
            _valueSent = true;
            var mv = { from_day: src.di, from_idx: src.ii, to_day: targetDi };
            dbg('drop → ' + JSON.stringify(mv));
            sendValue(mv);
        }; })(col, di));

        var body = document.createElement('div');
        body.className = 'day-body';

        if (day.items.length === 0) {
            var empty = document.createElement('div');
            empty.className = 'empty-day';
            empty.textContent = 'descanso';
            body.appendChild(empty);
        }

        day.items.forEach((function(parentDi) { return function(item, ii) {
            var s = document.createElement('div');
            s.className = 'ses';
            s.draggable = true;
            // Color de borde y fondo según estado
            s.style.borderColor = item.color;
            if (item.estado_bg) s.style.background = item.estado_bg;

            // Píldora del tipo de entrenamiento (sólo el nombre)
            var pill = document.createElement('div');
            pill.className = 'pill-type';
            pill.style.color = item.color;
            pill.style.borderColor = item.color;
            pill.style.pointerEvents = 'none';
            pill.textContent = item.emoji + ' ' + item.label;
            s.appendChild(pill);

            // Carga PLANIFICADA (km · min) — sólo en carreras
            if (item.carga && item.carga !== '') {
                var cargaP = document.createElement('div');
                cargaP.className = 'carga-plan';
                cargaP.style.pointerEvents = 'none';
                cargaP.textContent = item.carga;
                s.appendChild(cargaP);
            }

            // Píldora de intensidad (alto/bajo) — debajo de la carga
            if (item.int && item.int !== '—' && item.int !== '') {
                var badge = document.createElement('span');
                badge.className = 'ses-int';
                badge.style.color = item.color;
                badge.style.borderColor = item.color;
                badge.style.pointerEvents = 'none';
                badge.textContent = item.int;
                s.appendChild(badge);
            }

            // Carga REAL (sólo si la sesión se hizo) — debajo de la intensidad
            if (item.carga_real && item.carga_real !== '') {
                var cargaR = document.createElement('div');
                cargaR.className = 'carga-real';
                cargaR.style.pointerEvents = 'none';
                cargaR.textContent = '✓ ' + item.carga_real;
                s.appendChild(cargaR);
            }

            // Píldora de calidad en esquina derecha (bueno/normal/malo)
            if (item.calidad === 'bueno' || item.calidad === 'normal' || item.calidad === 'malo') {
                var cal = document.createElement('span');
                cal.className = 'calidad-pill cal-' + item.calidad;
                cal.style.pointerEvents = 'none';
                cal.textContent = item.calidad;
                s.appendChild(cal);
            }

            // ADAPTADO badge si la alerta empieza con emoji cerebro
            if (item.alerta && item.alerta.length > 0) {
                var fc = item.alerta.charCodeAt(0);
                if (fc === 0xD83E) {
                    var adapt = document.createElement('span');
                    adapt.className = 'adapt-pill';
                    adapt.textContent = 'ADAPTADO';
                    pill.appendChild(adapt);
                }
            }

            s.addEventListener('dragstart', (function(di2, ii2) { return function(e) {
                src = { di: di2, ii: ii2 };
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', JSON.stringify({ di: di2, ii: ii2 }));
                setTimeout(function() { s.classList.add('dragging'); }, 0);
            }; })(parentDi, ii));

            s.addEventListener('dragend', function() {
                s.classList.remove('dragging');
                src = null;
                document.querySelectorAll('.day-col').forEach(function(c) { c.classList.remove('over'); });
            });

            body.appendChild(s);
        }; })(di));

        col.appendChild(body);
        el.appendChild(col);
    });

    setTimeout(sendHeight, 50);
}

window.addEventListener('message', function(event) {
    var data = event.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'streamlit:render') {
        var args = data.args || {};
        try {
            var boardData = typeof args.board === 'string' ? JSON.parse(args.board) : args.board;
            if (boardData) renderBoard(boardData);
        } catch(e) {
            dbg('err: ' + e.message);
        }
    }
});

sendReady();
</script>
</body>
</html>
