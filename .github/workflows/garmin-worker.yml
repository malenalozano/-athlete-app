name: Garmin Worker Daily Sync

on:
  workflow_dispatch:
    inputs:
      dias:
        description: "Días a sincronizar"
        required: false
        default: "7"
      usuario:
        description: "ID de usuario (vacío = todos)"
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * *"   # 6 AM UTC = 8 AM España

jobs:
  sync-garmin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Garmin cloud worker (uses stored tokens)
        run: |
          DIAS="${{ github.event.inputs.dias || '7' }}"
          USUARIO="${{ github.event.inputs.usuario || '' }}"
          if [ -n "$USUARIO" ]; then
            python garmin_worker_cloud.py --dias "$DIAS" --usuario "$USUARIO"
          else
            python garmin_worker_cloud.py --dias "$DIAS"
          fi
