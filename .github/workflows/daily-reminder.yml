name: Recordatorio diario entrenamiento

on:
  schedule:
    # 8:00 AM Madrid — cron en UTC
    # Verano CEST (UTC+2, abr-oct): 6:00 UTC = 8:00 AM ✓
    # Invierno CET  (UTC+1, oct-mar): 7:00 UTC = 8:00 AM ✓
    # El script detecta la hora real de Madrid y aborta si no es ~8 AM
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch: # Lanzar manualmente desde GitHub para probar

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Enviar sesion de hoy a ntfy
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python3 << 'EOF'
          import os, urllib.request, urllib.parse, json, sys
          from datetime import datetime, timezone, timedelta

          db_url   = os.environ.get("TURSO_DATABASE_URL", "")
          token    = os.environ.get("TURSO_AUTH_TOKEN", "")
          topic    = os.environ.get("NTFY_TOPIC", "")

          # Validar secretos antes de empezar
          missing = [k for k,v in [("TURSO_DATABASE_URL",db_url),("TURSO_AUTH_TOKEN",token),("NTFY_TOPIC",topic)] if not v]
          if missing:
              print(f"ERROR: faltan secretos en GitHub Actions: {', '.join(missing)}", file=sys.stderr)
              print("Ve a GitHub -> Settings -> Secrets and variables -> Actions y aniadelos.")
              sys.exit(1)

          # Detectar hora real en Madrid (verano UTC+2, invierno UTC+1)
          # Verano CEST: último domingo de marzo al último domingo de octubre
          now_utc = datetime.now(timezone.utc)
          # Calcular offset DST de España de forma simple
          year = now_utc.year
          def ultimo_domingo(year, mes):
              d = datetime(year, mes, 31) if mes in (1,3,5,7,8,10,12) else datetime(year, mes, 30)
              while d.weekday() != 6: d -= timedelta(days=1)
              return d
          inicio_verano = ultimo_domingo(year, 3).replace(hour=1, tzinfo=timezone.utc)
          fin_verano    = ultimo_domingo(year, 10).replace(hour=1, tzinfo=timezone.utc)
          es_verano = inicio_verano <= now_utc < fin_verano
          madrid_offset = timedelta(hours=2 if es_verano else 1)
          ahora_madrid = now_utc + madrid_offset
          hora_madrid = ahora_madrid.hour
          hoy = ahora_madrid.strftime("%Y-%m-%d")

          print(f"Hora Madrid: {ahora_madrid.strftime('%H:%M')} ({'verano' if es_verano else 'invierno'})")

          # Abortar si no son las 8 AM (el otro cron del par no toca)
          if hora_madrid != 8:
              print(f"No son las 8:00 AM en Madrid (son las {hora_madrid}:XX). Nada que hacer.")
              sys.exit(0)
          print(f"Consultando plan para: {hoy}")

          # Consultar Turso via HTTP
          api_url = db_url.replace("libsql://", "https://") + "/v2/pipeline"
          sql = """
            SELECT p.tipo, p.sesion, p.km_planificados, p.duracion_min, p.intensidad, p.detalles
            FROM plan_entrenamiento p
            WHERE p.fecha = ? AND p.usuario_id = 1
            ORDER BY p.id
          """
          payload = json.dumps({
            "requests": [{"type": "execute", "stmt": {"sql": sql, "args": [{"type":"text","value": hoy}]}}]
          }).encode()

          req = urllib.request.Request(api_url, data=payload,
            headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=15) as r:
            data = json.loads(r.read())

          rows = data["results"][0]["response"]["result"]["rows"]
          print(f"Sesiones encontradas: {len(rows)}")

          def val(c): return c.get("value") if c.get("type") != "null" else None

          # Detectar grupo de fuerza (Push/Pull/Pierna)
          def detectar_grupo(sesion_nombre):
            if not sesion_nombre: return None
            s = sesion_nombre.lower()
            if "push" in s: return "Push"
            if "pull" in s: return "Pull"
            if "pierna" in s: return "Pierna"
            return None

          # Consultar ejercicios activos de un grupo con su ultimo registro y subir_peso
          def get_ejercicios_grupo(grupo):
            sql2 = """
              SELECT e.nombre, h.series, h.repeticiones, h.peso, COALESCE(e.subir_peso, 0)
              FROM ejercicios_catalogo e
              LEFT JOIN historial_ejercicio h ON h.id = (
                SELECT id FROM historial_ejercicio
                WHERE ejercicio_id = e.id AND usuario_id = e.usuario_id
                ORDER BY fecha DESC, id DESC LIMIT 1
              )
              WHERE e.usuario_id = 1 AND LOWER(e.grupo_muscular) = LOWER(?)
                AND (e.archivado IS NULL OR e.archivado = 0)
              ORDER BY e.nombre
            """
            payload2 = json.dumps({"requests": [{"type": "execute", "stmt": {"sql": sql2, "args": [{"type":"text","value": grupo}]}}]}).encode()
            req2 = urllib.request.Request(api_url, data=payload2, headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
            with urllib.request.urlopen(req2, timeout=15) as r2:
              d2 = json.loads(r2.read())
            resultado = []
            for r in d2["results"][0]["response"]["result"]["rows"]:
              nombre, series, reps, peso, subir_peso = [val(c) for c in r]
              if nombre:
                linea = nombre
                if series and reps and peso:
                  linea += f" {int(float(series))}x{int(float(reps))} {float(peso):.0f}kg"
                if subir_peso and int(float(subir_peso)) == 1:
                  linea += " ↑SUBE PESO"
                resultado.append(linea)
            return resultado

          # Formatear mensaje
          EMOJIS = {"fuerza": "💪", "carrera": "🏃", "cross": "🚴", "descanso": "😴"}

          if not rows:
            mensaje = "Sin sesiones hoy. Dia de descanso! 🛌"
            title   = "Plan de hoy"
            tags    = "calendar,zzz"
          else:
            lineas = []
            for row in rows:
              tipo, sesion, km, mins, intens, detalle = [val(c) for c in row]
              emoji = next((e for k,e in EMOJIS.items() if k in (tipo or "").lower()), "📋")
              partes = [f"{emoji} {sesion or tipo}"]
              if km:   partes.append(f"{km} km")
              if mins:
                h, m = int(float(mins))//60, int(float(mins))%60
                partes.append(f"{h}h {m}min" if h else f"{m} min")
              if intens: partes.append(intens)
              lineas.append(" · ".join(partes))

              # Si es fuerza, listar ejercicios activos del grupo
              if (tipo or "").lower() == "fuerza":
                grupo = detectar_grupo(sesion)
                if grupo:
                  nombres = [n for n in get_ejercicios_grupo(grupo) if n]
                  if nombres:
                    lineas.append("   " + " | ".join(nombres))
                  else:
                    lineas.append(f"   (sin ejercicios {grupo} configurados en la app)")

            n = len(rows)
            mensaje = "\n".join(lineas)
            title   = f"Plan de hoy - {n} sesion" if n == 1 else f"Plan de hoy - {n} sesiones"
            tags    = "calendar,runner"

          print(f"Enviando a ntfy: {title}")
          print(mensaje)

          # Enviar a ntfy
          ntfy_req = urllib.request.Request(
            f"https://ntfy.sh/{topic}",
            data=mensaje.encode("utf-8"),
            headers={"Title": title, "Tags": tags, "Priority": "default"}
          )
          with urllib.request.urlopen(ntfy_req, timeout=10) as r:
            print(f"ntfy status: {r.status}")

          EOF
